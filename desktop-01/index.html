<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WR4P · Escritorio</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#e4f7ff;background:#08141c}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #287184}h1{letter-spacing:.22em;font-size:23px}button{font:inherit;color:inherit;background:#142e3b;border:1px solid #438b9c;border-radius:9px;padding:9px;cursor:pointer}#desk{position:relative;height:calc(100dvh - 115px);overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#183d4b,transparent 70%),linear-gradient(#55c9e512 1px,transparent 1px),linear-gradient(90deg,#55c9e512 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;touch-action:none}.obj{position:absolute;display:grid;justify-items:center;gap:4px;width:112px;padding:8px;cursor:grab;touch-action:none;user-select:none;border-radius:12px}.obj:focus-visible{outline:2px solid cyan}.obj svg{width:82px;height:72px;filter:drop-shadow(0 8px 9px #0009)}.obj[data-size="1"]{width:145px;background:#112b37cc;border:1px solid #3a8194}.obj[data-size="2"]{width:174px;background:#112b37ee;border:1px solid #3a8194}.obj[data-size="2"] svg{width:110px;height:90px}.obj small{display:none;color:#a0c9d5}.obj:not([data-size="0"]) small{display:block}.obj button{font-size:11px;padding:3px 7px}footer{height:51px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:12px;color:#a0c9d5}dialog{color:#e4f7ff;background:#142a36;border:1px solid #57bbd2;border-radius:16px;width:min(90vw,540px);padding:24px;box-shadow:0 0 60px #000a}dialog::backdrop{background:#020a12a0}dialog header{height:auto;padding:0 0 12px}dialog p{color:#b1cbd5} @media(max-width:480px){header{padding:0 12px}footer{font-size:10px}.obj{width:96px}.obj svg{width:66px;height:60px}.obj[data-size="2"]{width:145px}}
</style><header><h1>WR4P</h1><button id="reset">Restablecer</button></header><main id="desk" aria-label="Escritorio"></main><footer>Arrastra · Doble toque para abrir · ↔ cambia tamaño</footer><dialog id="win"><header><strong id="title"></strong><button id="close">Cerrar</button></header><p>Espacio de trabajo de prueba. El contenido se desarrollará después.</p></dialog><script>
const icons=[
'<g transform="rotate(-9 45 40)"><rect x="12" y="9" width="65" height="59" rx="3" fill="#b7b3a6"/></g><g transform="rotate(8 45 40)"><rect x="21" y="10" width="65" height="59" rx="3" fill="#e5dfce"/><rect x="26" y="15" width="55" height="43" fill="#72979c"/><path d="M26 48L48 29L81 46V58H26" fill="#496b62"/><path d="M37 43L54 30L70 43V58H37" fill="#c6b497"/><rect x="51" y="45" width="10" height="13" fill="#33474b"/></g>',

'<path d="M5 20L34 9L66 20L95 9V62L66 73L34 62L5 73Z" fill="#153e4d" stroke="#65d9ec"/><path d="M34 9V62M66 20V73M8 53L34 31L66 46L92 24" fill="none" stroke="#a3f1ff" stroke-width="2"/><circle cx="66" cy="46" r="6" fill="#a3f1ff"/>',
'<rect x="9" y="28" width="82" height="43" rx="6" fill="#9e8d74"/><path d="M35 28V17H65V28" fill="none" stroke="#d6c6a9" stroke-width="6"/><rect x="9" y="28" width="82" height="19" rx="4" fill="#c5b598"/><rect x="44" y="42" width="13" height="11" rx="2" fill="#394b51"/>'];
const names=['Locaciones','Proyectos','Mesa de luz','Territorio','Herramientas'],desc=['Biblioteca visual','Producciones','Fotografías','Mapas y espacios','Estación de trabajo'];const desk=document.querySelector('#desk'),win=document.querySelector('#win');let saved={};try{saved=JSON.parse(localStorage.getItem('wr4p-desktop-01')||'{}')}catch{};function persist(){try{localStorage.setItem('wr4p-desktop-01',JSON.stringify(saved))}catch{}}function open(i){document.querySelector('#title').textContent=names[i];win.showModal()}function place(el,i){let s=saved[i]||{x:(i%2)*.65+.04,y:Math.floor(i/2)*.32+.03,size:0};el.dataset.size=s.size;el.style.left=Math.max(0,Math.min(1,s.x))*(Math.max(0,desk.clientWidth-el.offsetWidth))+'px';el.style.top=Math.max(0,Math.min(1,s.y))*(Math.max(0,desk.clientHeight-el.offsetHeight))+'px'}function save(el,i){saved[i]={x:el.offsetLeft/Math.max(1,desk.clientWidth-el.offsetWidth),y:el.offsetTop/Math.max(1,desk.clientHeight-el.offsetHeight),size:+el.dataset.size};persist()}names.forEach((n,i)=>{let el=document.createElement('div');el.className='obj';el.tabIndex=0;el.setAttribute('aria-label',n);el.innerHTML='<svg viewBox="0 0 100 80">'+icons[i]+'</svg><strong>'+n+'</strong><small>'+desc[i]+'</small><button aria-label="Cambiar tamaño">↔</button>';desk.append(el);place(el,i);let p,last=0;el.onpointerdown=e=>{if(e.target.closest('button'))return;el.setPointerCapture(e.pointerId);p={x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop,m:false}};el.onpointermove=e=>{if(!p)return;let x=e.clientX-p.x,y=e.clientY-p.y;if(Math.abs(x)+Math.abs(y)>6)p.m=true;if(p.m){el.style.left=Math.max(0,Math.min(desk.clientWidth-el.offsetWidth,p.l+x))+'px';el.style.top=Math.max(0,Math.min(desk.clientHeight-el.offsetHeight,p.t+y))+'px'}};el.onpointerup=()=>{if(!p)return;if(p.m)save(el,i);else{let now=Date.now();if(now-last<450){open(i);last=0}else last=now}p=null};el.onpointercancel=()=>{p=null};el.onkeydown=e=>{if(e.key==='Enter'&&e.target===el)open(i)};el.querySelector('button').onclick=()=>{save(el,i);saved[i].size=(saved[i].size+1)%3;persist();place(el,i)}});window.addEventListener('resize',()=>[...desk.children].forEach(place));document.querySelector('#reset').onclick=()=>{saved={};persist();[...desk.children].forEach(place)};document.querySelector('#close').onclick=()=>win.close();win.onclick=e=>{if(e.target===win){let r=win.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)win.close()}};
</script></html>
