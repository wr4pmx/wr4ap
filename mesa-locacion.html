<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WR4P — Mesa de locación</title><style>*{box-sizing:border-box}body{margin:0;background:#141618;color:#eee;font:16px system-ui}header,main{padding:24px;max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;border-bottom:1px solid #444}h1{font-size:36px}button,input,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #666;background:#292d30;color:white}button{cursor:pointer}button[aria-pressed=true]{background:#e5b97c;color:#171717}nav{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:18px}.tile{background:#25292c;border:1px solid #555;border-radius:12px;padding:8px;overflow:hidden}.tile img{width:100%;aspect-ratio:4/3;object-fit:cover}.tile input{margin:8px}.map{width:100%;max-height:500px;background:#29332f;border-radius:12px}aside{color:#b9bfc0}section[hidden]{display:none}label{display:inline-block;margin:8px}small{color:#b9bfc0}</style><header><b>WR4P.</b><small>DEMO · Datos ficticios · Sesión local</small></header><main><h1>Casa 01</h1><p>Proyecto de demostración / Locaciones</p><nav><button id="roll" aria-pressed="true">Rollo fotográfico</button><button id="territory" aria-pressed="false">Mesa territorial</button></nav><section id="photos"><p>Agrega imágenes de prueba. Se procesan localmente; no se suben a un servidor.</p><input id="upload" type="file" accept="image/jpeg,image/png,image/webp" multiple><p><button id="group">Asignar área</button> <button id="download">Descargar selección</button> <button id="undo">Deshacer cambio</button> <button id="up">Mover antes</button> <button id="down">Mover después</button> <button id="all">Seleccionar todas</button> <button id="none">Limpiar selección</button></p><p id="status" role="status"></p><div class="grid" id="gallery"></div></section><section id="space" hidden><h2>Lectura del lugar</h2><p>Esquema ficticio, no georreferenciado. Selecciona un punto para consultar su función.</p><svg class="map" viewBox="0 0 600 340" role="img" aria-label="Esquema ficticio de accesos y servicios"><path d="M0 175H600M310 0V340" stroke="#65716b" stroke-width="48"/><rect x="35" y="25" width="230" height="110" rx="12" fill="#52695b"/><rect x="350" y="25" width="210" height="110" rx="12" fill="#52695b"/><rect x="35" y="215" width="230" height="100" rx="12" fill="#52695b"/><rect x="350" y="215" width="210" height="100" rx="12" fill="#52695b"/><g fill="#fff" font-size="16" text-anchor="middle"><text x="150" y="85">Locación</text><text x="455" y="85">Basecamp</text><text x="150" y="270">Catering</text><text x="455" y="270">Estacionamiento</text><text x="310" y="180">Acceso</text></g></svg><nav id="points"></nav><p id="info" role="status">Selecciona un espacio.</p></section></main><script>const $=id=>document.getElementById(id);let items=[],history=[];function tab(photo){$('photos').hidden=!photo;$('space').hidden=photo;$('roll').setAttribute('aria-pressed',photo);$('territory').setAttribute('aria-pressed',!photo)}$('roll').onclick=()=>tab(true);$('territory').onclick=()=>tab(false);function render(){const g=$('gallery');g.replaceChildren();items.forEach(p=>{const d=document.createElement('div');d.className='tile';const im=document.createElement('img');im.src=p.url;im.alt=p.name;const l=document.createElement('label');const c=document.createElement('input');c.type='checkbox';c.checked=p.selected;c.onchange=()=>p.selected=c.checked;l.append(c,document.createTextNode(p.name+' · '+p.area));d.append(im,l);g.append(d)})}$('upload').onchange=async()=>{const files=[...$('upload').files];$('upload').disabled=true;let failed=0;for(const f of files){try{if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>20000000)throw Error();const b=await createImageBitmap(f);try{if(b.width*b.height>40000000)throw Error();const s=Math.min(1,2560/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.width*s));c.height=Math.max(1,Math.round(b.height*s));const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(b,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.87));if(!blob)throw Error();items.push({name:f.name.replace(/\.[^.]+$/,'')+'.jpg',url:URL.createObjectURL(blob),area:'Sin área',selected:false})}finally{b.close()}}catch{failed++}}$('upload').disabled=false;$('upload').value='';$('status').textContent=items.length+' fotos · '+failed+' rechazadas';render()};$('group').onclick=()=>{const selected=items.filter(p=>p.selected);if(!selected.length)return;const area=prompt('Nombre del área');if(!area?.trim())return;snapshot();selected.forEach(p=>p.area=area.trim());render()};function snapshot(){history.push(items.map(p=>[p,p.area]));if(history.length>50)history.shift()}function move(dir){const indices=items.map((_,i)=>i);if(dir>0)indices.reverse();let changed=false;for(const i of indices){const j=i+dir;if(items[i]?.selected&&items[j]&&!items[j].selected){if(!changed)snapshot();changed=true;[items[i],items[j]]=[items[j],items[i]]}}if(changed)render()}$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);$('all').onclick=()=>{items.forEach(p=>p.selected=true);render()};$('none').onclick=()=>{items.forEach(p=>p.selected=false);render()};$('undo').onclick=()=>{const old=history.pop();if(!old)return;const known=new Set(old.map(([p])=>p));const added=items.filter(p=>!known.has(p));old.forEach(([p,a])=>p.area=a);items=[...old.map(([p])=>p),...added];render()};$('download').onclick=()=>{items.filter(p=>p.selected).forEach(p=>{const a=document.createElement('a');a.href=p.url;a.download=p.name;a.click()})};for(const [name,info] of Object.entries({'Locación':'Espacio creativo principal.','Basecamp':'Evaluar capacidad, sanitarios y conexión con set.','Catering':'Evaluar sombra, agua y circulación.','Estacionamiento':'Evaluar dimensiones, capacidad y restricciones.','Acceso':'Evaluar maniobras, peatones y rutas de emergencia.'})){const b=document.createElement('button');b.textContent=name;b.onclick=()=>$('info').textContent=name+': '+info;$('points').append(b)}</script></html>
