<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WR4P · Scouting LAB 0.2</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#e4f7ff;background:#08141c}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #287184}h1{letter-spacing:.22em;font-size:23px}button{font:inherit;color:inherit;background:#142e3b;border:1px solid #438b9c;border-radius:9px;padding:9px;cursor:pointer}#desk{position:relative;height:calc(100dvh - 115px);overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#183d4b,transparent 70%),linear-gradient(#55c9e512 1px,transparent 1px),linear-gradient(90deg,#55c9e512 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;touch-action:none}.obj{position:absolute;display:grid;justify-items:center;gap:4px;width:112px;padding:8px;cursor:grab;touch-action:none;user-select:none;border-radius:12px}.obj:focus-visible{outline:2px solid cyan}.obj svg{width:82px;height:72px;filter:drop-shadow(0 8px 9px #0009)}.obj[data-size="1"]{width:145px;background:#112b37cc;border:1px solid #3a8194}.obj[data-size="2"]{width:174px;background:#112b37ee;border:1px solid #3a8194}.obj[data-size="2"] svg{width:110px;height:90px}.obj small{display:none;color:#a0c9d5}.obj:not([data-size="0"]) small{display:block}.obj button{font-size:11px;padding:3px 7px}footer{height:51px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:12px;color:#a0c9d5}dialog{color:#e4f7ff;background:#142a36;border:1px solid #57bbd2;border-radius:16px;width:min(90vw,540px);padding:24px;box-shadow:0 0 60px #000a}dialog::backdrop{background:#020a12a0}dialog header{height:auto;padding:0 0 12px}dialog p{color:#b1cbd5} @media(max-width:480px){header{padding:0 12px}footer{font-size:10px}.obj{width:96px}.obj svg{width:66px;height:60px}.obj[data-size="2"]{width:145px}}
</style><header><h1>WR4P LAB 0.2</h1><button id="reset">Restablecer</button></header><main id="desk" aria-label="Escritorio"></main><footer>Arrastra · Doble toque para abrir · ↔ cambia tamaño</footer><dialog id="win"><header><strong id="title"></strong><button id="close">Cerrar</button></header><p id="placeholder">Espacio de trabajo de prueba.</p><style>dialog{max-height:88dvh;overflow:auto}#scout label{display:grid;gap:5px;margin:12px 0}#scout input,#scout textarea{width:100%;font:inherit;color:inherit;background:#08141c;border:1px solid #438b9c;border-radius:7px;padding:10px}#scout img{width:100%;height:110px;object-fit:cover;border-radius:6px}#photos,#archive{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}#scout article{border:1px solid #438b9c;padding:10px;border-radius:8px;overflow-wrap:anywhere}#scout nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}</style><section id="scout" hidden><p>Laboratorio 0.2 · Datos guardados únicamente en este navegador. No es un respaldo.</p><nav><button id="newLoc">Capturar locación</button><button id="showArchive">Archivo de locaciones</button></nav><form id="capture" hidden><label>Fotografías<input id="camera" type="file" accept="image/*" capture="environment"><input id="gallery" type="file" accept="image/*" multiple></label><div id="photos"></div><label>Nombre<input name="name" placeholder="Nombre provisional"></label><label>Dirección<input name="address"></label><button type="button" id="gps">Obtener GPS</button><output id="coords"></output><label>Tipo de espacio<input name="type"></label><label>Contacto<input name="contact"></label><label>Observaciones<textarea name="notes"></textarea></label><button id="saveLoc">Guardar locación</button></form><div id="archive"></div><p id="status" role="status"></p></section></dialog><script>
const icons=[
'<g transform="rotate(-9 45 40)"><rect x="12" y="9" width="65" height="59" rx="3" fill="#b7b3a6"/></g><g transform="rotate(8 45 40)"><rect x="21" y="10" width="65" height="59" rx="3" fill="#e5dfce"/><rect x="26" y="15" width="55" height="43" fill="#72979c"/><path d="M26 48L48 29L81 46V58H26" fill="#496b62"/><path d="M37 43L54 30L70 43V58H37" fill="#c6b497"/><rect x="51" y="45" width="10" height="13" fill="#33474b"/></g>',
'<rect x="8" y="30" width="82" height="42" rx="4" fill="#26363d" stroke="#a0b5bc"/><g transform="rotate(-15 8 30)"><rect x="8" y="14" width="82" height="16" fill="#ddd"/><path d="M15 14h13l-10 16H5M40 14h13L43 30H30M65 14h13L68 30H55" fill="#26363d"/></g><path d="M18 43H80M18 54H80M18 64H57" stroke="#a0b5bc"/>',
'<rect x="5" y="12" width="90" height="58" rx="5" fill="#17252d" stroke="#65d9ec"/><path d="M12 20H88M12 62H88" stroke="#c1e6e9" stroke-width="5" stroke-dasharray="7 5"/><rect x="12" y="28" width="23" height="26" fill="#8fa99b"/><rect x="39" y="28" width="23" height="26" fill="#b4a18a"/><rect x="66" y="28" width="23" height="26" fill="#71949e"/>',
'<path d="M5 20L34 9L66 20L95 9V62L66 73L34 62L5 73Z" fill="#153e4d" stroke="#65d9ec"/><path d="M34 9V62M66 20V73M8 53L34 31L66 46L92 24" fill="none" stroke="#a3f1ff" stroke-width="2"/><circle cx="66" cy="46" r="6" fill="#a3f1ff"/>',
'<rect x="9" y="28" width="82" height="43" rx="6" fill="#9e8d74"/><path d="M35 28V17H65V28" fill="none" stroke="#d6c6a9" stroke-width="6"/><rect x="9" y="28" width="82" height="19" rx="4" fill="#c5b598"/><rect x="44" y="42" width="13" height="11" rx="2" fill="#394b51"/>'];
const names=['Locaciones','Proyectos','Mesa de luz','Territorio','Herramientas'],desc=['Biblioteca visual','Producciones','Fotografías','Mapas y espacios','Estación de trabajo'];const desk=document.querySelector('#desk'),win=document.querySelector('#win');let saved={};try{saved=JSON.parse(localStorage.getItem('wr4p-desktop-02')||'{}')}catch{};function persist(){try{localStorage.setItem('wr4p-desktop-02',JSON.stringify(saved))}catch{}}function open(i){document.querySelector('#title').textContent=names[i];document.querySelector("#scout").hidden=i!==0;document.querySelector("#placeholder").hidden=i===0;win.showModal()}function place(el,i){let s=saved[i]||{x:(i%2)*.65+.04,y:Math.floor(i/2)*.32+.03,size:0};el.dataset.size=s.size;el.style.left=Math.max(0,Math.min(1,s.x))*(Math.max(0,desk.clientWidth-el.offsetWidth))+'px';el.style.top=Math.max(0,Math.min(1,s.y))*(Math.max(0,desk.clientHeight-el.offsetHeight))+'px'}function save(el,i){saved[i]={x:el.offsetLeft/Math.max(1,desk.clientWidth-el.offsetWidth),y:el.offsetTop/Math.max(1,desk.clientHeight-el.offsetHeight),size:+el.dataset.size};persist()}names.forEach((n,i)=>{let el=document.createElement('div');el.className='obj';el.tabIndex=0;el.setAttribute('aria-label',n);el.innerHTML='<svg viewBox="0 0 100 80">'+icons[i]+'</svg><strong>'+n+'</strong><small>'+desc[i]+'</small><button aria-label="Cambiar tamaño">↔</button>';desk.append(el);place(el,i);let p,last=0;el.onpointerdown=e=>{if(e.target.closest('button'))return;el.setPointerCapture(e.pointerId);p={x:e.clientX,y:e.clientY,l:el.offsetLeft,t:el.offsetTop,m:false}};el.onpointermove=e=>{if(!p)return;let x=e.clientX-p.x,y=e.clientY-p.y;if(Math.abs(x)+Math.abs(y)>6)p.m=true;if(p.m){el.style.left=Math.max(0,Math.min(desk.clientWidth-el.offsetWidth,p.l+x))+'px';el.style.top=Math.max(0,Math.min(desk.clientHeight-el.offsetHeight,p.t+y))+'px'}};el.onpointerup=()=>{if(!p)return;if(p.m)save(el,i);else{let now=Date.now();if(now-last<450){open(i);last=0}else last=now}p=null};el.onpointercancel=()=>{p=null};el.onkeydown=e=>{if(e.key==='Enter'&&e.target===el)open(i)};el.querySelector('button').onclick=()=>{save(el,i);saved[i].size=(saved[i].size+1)%3;persist();place(el,i)}});window.addEventListener('resize',()=>[...desk.children].forEach(place));document.querySelector('#reset').onclick=()=>{saved={};persist();[...desk.children].forEach(place)};document.querySelector('#close').onclick=()=>win.close();win.onclick=e=>{if(e.target===win){let r=win.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)win.close()}};

const q=s=>document.querySelector(s), form=q('#capture'), archive=q('#archive'), status=q('#status');let photos=[],urls=[],coords=null,editing=null,busy=false;
const db=new Promise((resolve,reject)=>{const req=indexedDB.open('wr4p-scouting-lab',1);req.onupgradeneeded=()=>req.result.createObjectStore('locations',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
db.catch(e=>status.textContent='No se pudo abrir el almacenamiento: '+e.message);
async function store(mode,fn){const d=await db;return new Promise((resolve,reject)=>{const tx=d.transaction('locations',mode);const req=fn(tx.objectStore('locations'));tx.oncomplete=()=>resolve(req.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('Operación cancelada'))})}
function clearUrls(){urls.forEach(URL.revokeObjectURL);urls=[]}
function photoImg(blob){const img=document.createElement('img');const url=URL.createObjectURL(blob);urls.push(url);img.src=url;img.alt='Fotografía de locación';return img}
function renderPhotos(){clearUrls();q('#photos').replaceChildren();photos.forEach((p,i)=>{const box=document.createElement('article'),b=document.createElement('button');b.type='button';b.textContent='Quitar';b.onclick=()=>{photos.splice(i,1);renderPhotos()};box.append(photoImg(p),b);q('#photos').append(box)})}
function start(record){if(busy)return;archive.replaceChildren();form.hidden=false;form.reset();editing=record||null;photos=record?[...record.photos]:[];coords=record?.coords||null;for(const k of ['name','address','type','contact','notes'])form.elements[k].value=record?.[k]||'';q('#coords').textContent=coords?coords.lat+', '+coords.lng:'';renderPhotos();status.textContent=''}
q('#newLoc').onclick=()=>start();for(const id of ['camera','gallery'])q('#'+id).onchange=e=>{photos.push(...Array.from(e.target.files).filter(f=>f.type.startsWith('image/')));e.target.value='';renderPhotos()};
q('#gps').onclick=()=>{if(!navigator.geolocation){status.textContent='GPS no disponible';return}const current=editing, token=++gpsToken;status.textContent='Buscando ubicación…';navigator.geolocation.getCurrentPosition(p=>{if(token!==gpsToken||form.hidden||current!==editing)return;coords={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy};q('#coords').textContent=coords.lat.toFixed(6)+', '+coords.lng.toFixed(6);status.textContent='Ubicación registrada'},e=>{if(token===gpsToken)status.textContent='GPS no disponible: '+e.message},{timeout:15000,enableHighAccuracy:true})};let gpsToken=0;form.addEventListener('reset',()=>gpsToken++);
form.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;q('#saveLoc').disabled=true;try{const data=Object.fromEntries(new FormData(form));const now=new Date().toISOString();await store('readwrite',s=>s.put({...data,name:data.name.trim()||'Locación sin nombre',id:editing?.id||crypto.randomUUID(),created:editing?.created||now,updated:now,photos:[...photos],coords}));await show();status.textContent='Locación guardada en este navegador'}catch(e){status.textContent='No se guardó: '+e.message}finally{busy=false;q('#saveLoc').disabled=false}};
async function show(){form.hidden=true;gpsToken++;clearUrls();archive.replaceChildren();try{const records=await store('readonly',s=>s.getAll());records.sort((a,b)=>b.updated.localeCompare(a.updated));if(!records.length)archive.textContent='Todavía no hay locaciones.';for(const r of records){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),b=document.createElement('button');h.textContent=r.name;p.textContent=[r.address,r.type,r.photos.length+' fotos',new Date(r.created).toLocaleDateString()].filter(Boolean).join(' · ');if(r.photos[0])a.append(photoImg(r.photos[0]));b.textContent='Abrir / editar';b.onclick=()=>start(r);a.append(h,p,b);archive.append(a)}}catch(e){status.textContent='No se pudo consultar: '+e.message}}
q('#showArchive').onclick=()=>{if(!busy)show()};
</script></html>
