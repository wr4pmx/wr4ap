name: WR4P test center smoke
on:
  pull_request:
    paths:
      - 'pruebas.html'
      - 'coordinacion.html'
      - 'tests/pruebas-smoke.cjs'
      - '.github/workflows/pruebas-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check test center
        run: node tests/pruebas-smoke.cjs
