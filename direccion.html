<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WR4P · Entrega de locaciones</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#f4f4f6;color:#20202a}*{box-sizing:border-box}body{margin:0}header{background:#14141b;color:#fff;padding:22px max(18px,calc((100vw - 860px)/2))}header strong{font-size:28px;letter-spacing:-1px}header b{color:#ff5b7b}main{max-width:860px;margin:auto;padding:28px 18px}h1{font-size:clamp(27px,5vw,42px);margin-bottom:4px}.muted{color:#667080}.card{background:#fff;border:1px solid #dedee5;border-radius:14px;padding:18px;margin:14px 0}.set{font-size:13px;color:#555b6e;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.option{padding:15px 0;border-bottom:1px solid #e8e8ed}.option:last-child{border:0}.option strong{display:block;font-size:19px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 4px}.photo{margin:0}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}.photo figcaption{font-size:11px;color:#666;overflow-wrap:anywhere;padding:5px 0}.area{font-size:12px;font-weight:700;color:#5c5671;margin-top:14px}.galleryStatus{font-size:12px;color:#777}.note{color:#505968;margin-top:6px;white-space:pre-wrap}a.button{display:inline-block;background:#f85b7b;color:#18090d;text-decoration:none;padding:13px 19px;border-radius:9px;font-weight:750}#error{color:#8d2235}footer{color:#7a8090;font-size:12px;margin-top:30px}@media print{header{background:white;color:black}a.button{display:none}}</style></head><body><header><strong>WR<b>4</b>P</strong><div>Presentación de locaciones · Dirección</div></header><main><p id="loading">Cargando entrega…</p><section id="content" hidden><h1 id="title"></h1><p id="date" class="muted"></p><p id="intro"></p><div id="sets"></div><div id="photos"></div><footer>Documento de presentación de locaciones · WR4P</footer></section><p id="error"></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://ttbgguotbvdwjjvgkkph.supabase.co','sb_publishable_s192QlVLTi36acVzU2ZpFg_waeUTBj6',{auth:{persistSession:false,autoRefreshToken:false}});const $=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get('token');if(!token||!/^[0-9a-f-]{36}$/i.test(token)){fail('Enlace inválido.')}else{const{data,error}=await db.rpc('read_shared_location_delivery',{p_token:token});if(error||!data)fail('Esta entrega no está disponible o su enlace fue revocado.');else await render(data)}function fail(s){$('loading').hidden=true;$('error').textContent=s}async function render(d){$('loading').hidden=true;$('content').hidden=false;$('title').textContent=(d.project||'Proyecto')+' · Entrega '+d.number;$('date').textContent=d.date||'';$('intro').textContent=d.intro||'Opciones de locación para revisión.';const groups=new Map();for(const o of d.items||[]){if(!groups.has(o.set))groups.set(o.set,[]);groups.get(o.set).push(o)}for(const [set,items]of groups){const card=document.createElement('section');card.className='card';const h=document.createElement('div');h.className='set';h.textContent=set;card.append(h);for(const o of items){const el=document.createElement('div');el.className='option';const title=document.createElement('strong');title.textContent=o.location;el.append(title);if(o.note){const p=document.createElement('div');p.className='note';p.textContent=o.note;el.append(p)}card.append(el);const gallery=document.createElement('div');gallery.className='gallery';gallery.dataset.location=o.location;el.append(gallery)}$('sets').append(card)}try{const response=await fetch('https://ttbgguotbvdwjjvgkkph.supabase.co/functions/v1/delivery-public-photos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(response.ok){const payload=await response.json();const photos=payload.photos||[];const locationNames=[...new Set((d.items||[]).map(x=>x.location))];const byName=new Map(locationNames.map(n=>[n,[]]));for(const item of d.items||[]){if(!byName.has(item.location))byName.set(item.location,[])}const galleries=[...document.querySelectorAll('.gallery')];for(const [index,item] of (d.items||[]).entries()){const target=galleries[index];if(!target)continue;const seen=new Set();const own=photos.filter(p=>p.location_id===item.location_id);for(const p of own){if(seen.has(p.id))continue;seen.add(p.id);const figure=document.createElement('figure');figure.className='photo';const link=document.createElement('a');link.href=p.url;link.target='_blank';link.rel='noopener noreferrer';const im=document.createElement('img');im.src=p.url;im.loading='lazy';im.alt=p.name||'Fotografía de locación';link.append(im);figure.append(link);const caption=document.createElement('figcaption');caption.textContent=(p.areas||[]).join(' · ')||p.name||'';figure.append(caption);target.append(figure)}}}else{const p=document.createElement('p');p.className='galleryStatus';p.textContent='Fotografías no disponibles en este momento.';$('photos').append(p)}}catch(e){const p=document.createElement('p');p.className='galleryStatus';p.textContent='No fue posible cargar las fotografías.';$('photos').append(p)}if(d.photos_url){try{const url=new URL(d.photos_url);if(['https:','http:'].includes(url.protocol)){const a=document.createElement('a');a.className='button';a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Ver fotografías de la entrega';$('photos').append(a)}}catch(e){}}}</script></body></html>
