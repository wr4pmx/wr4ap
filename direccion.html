<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WR4P · Entrega de locaciones</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#f4f4f6;color:#20202a}*{box-sizing:border-box}body{margin:0}header{background:#14141b;color:#fff;padding:22px max(18px,calc((100vw - 860px)/2))}header strong{font-size:28px;letter-spacing:-1px}header b{color:#ff5b7b}main{max-width:860px;margin:auto;padding:28px 18px}h1{font-size:clamp(27px,5vw,42px);margin-bottom:4px}.muted{color:#667080}.card{background:#fff;border:1px solid #dedee5;border-radius:14px;padding:18px;margin:14px 0}.set{font-size:13px;color:#555b6e;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.option{padding:15px 0;border-bottom:1px solid #e8e8ed}.option:last-child{border:0}.option strong{display:block;font-size:19px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 4px}.photo{margin:0}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}.photo figcaption{font-size:11px;color:#666;overflow-wrap:anywhere;padding:5px 0}.area{font-size:12px;font-weight:700;color:#5c5671;margin-top:14px}.galleryStatus{font-size:12px;color:#777}.note{color:#505968;margin-top:6px;white-space:pre-wrap}a.button,button.button{display:inline-block;border:0;cursor:pointer;font:inherit;background:#f85b7b;color:#18090d;text-decoration:none;padding:13px 19px;border-radius:9px;font-weight:750}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}.downloadPhoto{display:inline-block;font-size:12px;margin-top:4px;color:#a22b50}@media print{.actions,.downloadPhoto{display:none!important}.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}.card{break-inside:avoid}.photo img{max-height:180px;object-fit:contain}}.feedback{background:#f7f7fa;padding:12px;border-radius:10px;margin-top:12px}.feedback label{display:block;font-weight:650;font-size:13px;margin:10px 0 4px}.feedback input,.feedback textarea,.feedback select{width:100%;font:inherit;padding:10px;border:1px solid #ccd0da;border-radius:7px}.feedback textarea{min-height:75px}.feedback button{background:#20202a;color:white;border:0;border-radius:8px;padding:10px 14px;margin-top:10px;cursor:pointer}.feedback button:disabled{opacity:.5}.feedback .response{font-size:13px;color:#32684b}#error{color:#8d2235}footer{color:#7a8090;font-size:12px;margin-top:30px}@media print{header{background:white;color:black}a.button{display:none}}</style></head><body><header><strong>WR<b>4</b>P</strong><div>Revisión de proyecto · Dirección</div></header><main><p id="loading">Cargando entrega…</p><section id="content" hidden><h1 id="title"></h1><p id="date" class="muted"></p><p id="intro"></p><div class="actions"><button type="button" id="printPresentation" class="button">Guardar presentación en PDF / Imprimir</button><span class="muted">Desde el menú de impresión selecciona Guardar como PDF.</span></div><div id="sets"></div><div id="photos"></div><footer>Presentación de proyecto · WR4P</footer></section><p id="error"></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://ttbgguotbvdwjjvgkkph.supabase.co','sb_publishable_s192QlVLTi36acVzU2ZpFg_waeUTBj6',{auth:{persistSession:false,autoRefreshToken:false}});const $=id=>document.getElementById(id);$('printPresentation').onclick=()=>window.print();const token=new URLSearchParams(location.search).get('token');if(!token||!/^[0-9a-f-]{36}$/i.test(token)){fail('Enlace inválido.')}else{const{data,error}=await db.rpc('read_shared_location_delivery',{p_token:token});if(error||!data)fail('Esta entrega no está disponible o su enlace fue revocado.');else await render(data)}function fail(s){$('loading').hidden=true;$('error').textContent=s}async function render(d){$('loading').hidden=true;$('content').hidden=false;$('title').textContent=(d.project||'Proyecto')+' · Entrega '+d.number;$('date').textContent=d.date||'';$('intro').textContent=d.intro||'Opciones de locación para revisión.';const groups=new Map();for(const o of d.items||[]){if(!groups.has(o.set))groups.set(o.set,[]);groups.get(o.set).push(o)}for(const [set,items]of groups){const card=document.createElement('section');card.className='card';const h=document.createElement('div');h.className='set';h.textContent=set;card.append(h);for(const o of items){const el=document.createElement('div');el.className='option';const title=document.createElement('strong');title.textContent=o.location;el.append(title);if(o.note){const p=document.createElement('div');p.className='note';p.textContent=o.note;el.append(p)}card.append(el);const feedback=document.createElement('div');feedback.className='feedback';const label=document.createElement('div');label.textContent='Opinión de Dirección';label.style.fontWeight='750';feedback.append(label);const name=document.createElement('label');name.textContent='Tu nombre';const who=document.createElement('input');who.placeholder='Nombre de quien revisa';who.maxLength=100;who.autocomplete='name';feedback.append(name,who);const typeLabel=document.createElement('label');typeLabel.textContent='¿Qué quieres enviar?';const type=document.createElement('select');for(const [value,title] of [['rating','Calificar propiedad'],['comment','Comentario'],['request','Solicitar fotografías o información']]){const op=document.createElement('option');op.value=value;op.textContent=title;type.append(op)}feedback.append(typeLabel,type);const starsLabel=document.createElement('label');starsLabel.textContent='Calificación';const stars=document.createElement('select');for(let n=5;n>=1;n--){const op=document.createElement('option');op.value=n;op.textContent=n+' / 5';stars.append(op)}feedback.append(starsLabel,stars);const requestLabel=document.createElement('label');requestLabel.textContent='Tipo de solicitud';const request=document.createElement('select');for(const [value,title] of [['night','Ver de noche'],['angle','Otro ángulo'],['detail','Más detalles'],['other','Otra solicitud']]){const op=document.createElement('option');op.value=value;op.textContent=title;request.append(op)}feedback.append(requestLabel,request);const bodyLabel=document.createElement('label');bodyLabel.textContent='Comentario o indicaciones';const body=document.createElement('textarea');body.maxLength=1500;body.placeholder='Ej. Necesitamos fotos nocturnas del acceso principal';feedback.append(bodyLabel,body);const response=document.createElement('p');response.className='response';response.setAttribute('role','status');const send=document.createElement('button');send.type='button';send.textContent='Enviar a Locaciones';feedback.append(send,response);function sync(){starsLabel.hidden=stars.hidden=type.value!=='rating';requestLabel.hidden=request.hidden=type.value!=='request';bodyLabel.hidden=body.hidden=type.value==='rating'}type.onchange=sync;sync();send.onclick=async()=>{const reviewer=who.value.trim(),message=body.value.trim();if(reviewer.length<2){response.textContent='Escribe tu nombre para identificar la respuesta.';return}if(type.value!=='rating'&&!message){response.textContent='Escribe tu comentario o solicitud.';return}send.disabled=true;response.textContent='Enviando…';const {error}=await db.rpc('submit_direction_feedback',{p_token:token,p_location_id:o.location_id,p_kind:type.value,p_reviewer_name:reviewer,p_body:type.value==='rating'?null:message,p_rating:type.value==='rating'?Number(stars.value):null,p_request_type:type.value==='request'?request.value:null});send.disabled=false;response.textContent=error?'No se pudo enviar: '+error.message:'Recibido. Locaciones podrá revisar tu respuesta.';if(!error)body.value=''};el.append(feedback);const gallery=document.createElement('div');gallery.className='gallery';gallery.dataset.location=o.location;el.append(gallery)}$('sets').append(card)}try{const response=await fetch('https://ttbgguotbvdwjjvgkkph.supabase.co/functions/v1/delivery-public-photos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(response.ok){const payload=await response.json();const photos=payload.photos||[];const locationNames=[...new Set((d.items||[]).map(x=>x.location))];const byName=new Map(locationNames.map(n=>[n,[]]));for(const item of d.items||[]){if(!byName.has(item.location))byName.set(item.location,[])}const galleries=[...document.querySelectorAll('.gallery')];for(const [index,item] of (d.items||[]).entries()){const target=galleries[index];if(!target)continue;const seen=new Set();const own=photos.filter(p=>p.location_id===item.location_id);for(const p of own){if(seen.has(p.id))continue;seen.add(p.id);const figure=document.createElement('figure');figure.className='photo';const link=document.createElement('a');link.href=p.url;link.target='_blank';link.rel='noopener noreferrer';const im=document.createElement('img');im.src=p.url;im.loading='lazy';im.alt=p.name||'Fotografía de locación';link.append(im);figure.append(link);const caption=document.createElement('figcaption');caption.textContent=(p.areas||[]).join(' · ')||p.name||'';figure.append(caption);const download=document.createElement('a');download.className='downloadPhoto';download.href=p.url;download.target='_blank';download.rel='noopener noreferrer';download.textContent='Abrir / guardar fotografía';figure.append(download);target.append(figure)}}}else{const p=document.createElement('p');p.className='galleryStatus';p.textContent='Fotografías no disponibles en este momento.';$('photos').append(p)}}catch(e){const p=document.createElement('p');p.className='galleryStatus';p.textContent='No fue posible cargar las fotografías.';$('photos').append(p)}if(d.photos_url){try{const url=new URL(d.photos_url);if(['https:','http:'].includes(url.protocol)){const a=document.createElement('a');a.className='button';a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Ver fotografías de la entrega';$('photos').append(a)}}catch(e){}}}</script></body></html>
