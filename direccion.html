io o indicaciones';const body=document.createElement('textarea');body.maxLength=1500;body.placeholder='Ej. Necesitamos fotos nocturnas del acceso principal';feedback.append(bodyLabel,body);const response=document.createElement('p');response.className='response';response.setAttribute('role','status');const send=document.createElement('button');send.type='button';send.textContent='Enviar a Locaciones';feedback.append(send,response);function sync(){trafficLabel.hidden=traffic.hidden=type.value!=='traffic';suggestLabel.hidden=suggest.hidden=type.value!=='suggestion';requestLabel.hidden=request.hidden=type.value!=='request';bodyLabel.hidden=body.hidden=['traffic','suggestion'].includes(type.value)}type.onchange=sync;sync();send.onclick=async()=>{const reviewer=who.value.trim(),message=body.value.trim();if(reviewer.length<2){response.textContent='Escribe tu nombre para identificar la respuesta.';return}if(['comment','request'].includes(type.value)&&!message){response.textContent='Escribe tu comentario o solicitud.';return}send.disabled=true;response.textContent='Enviando…';if(type.value==='suggestion'&&!suggest.value){response.textContent='No hay otro set disponible para sugerir.';send.disabled=false;return}const {error}=await db.rpc('submit_direction_feedback_v2',{p_token:token,p_location_id:o.location_id,p_set_id:o.set_id,p_kind:type.value,p_reviewer_name:reviewer,p_body:['traffic','suggestion'].includes(type.value)?null:message,p_traffic_light:type.value==='traffic'?traffic.value:null,p_suggested_set_id:type.value==='suggestion'?suggest.value:null,p_request_type:type.value==='request'?request.value:null});send.disabled=false;response.textContent=error?'No se pudo enviar: '+error.message:'Recibido. Locaciones podrá revisar tu respuesta.';if(!error)body.value=''};el.append(feedback);

}

 const response=await fetch('https://ttbgguotbvdwjjvgkkph.supabase.co/functions/v1/delivery-public-photos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
